[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-agents"
version = "0.1.0"
description = "Durable, extensible business, perception and data agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.28,<1", "httpcore==1.0.9", "jsonschema>=4.23,<5", "argon2-cffi>=23,<26", "cryptography==50.0.2",
  "redis>=5,<8", "celery>=5.4,<6", "python-multipart>=0.0.20,<1", "pillow>=11,<13",
  "defusedxml==0.7.1", "openpyxl==3.1.5", "pypdf==6.12.2", "smbprotocol==1.17.0", "asyncua==2.1.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pyftpdlib>=2,<3"]
mqtt = ["paho-mqtt==2.1.0"]

[project.scripts]
ga = "generic_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generic_agents = ["web/*.html", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
