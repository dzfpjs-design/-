<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三智能体 · 工作台</title>
<style>
:root{color-scheme:light;--ink:#15313b;--muted:#647780;--line:#dce5e7;--brand:#126969;--bg:#f4f7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;background:var(--brand);color:white;padding:9px 17px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e5efef;color:var(--brand)}input,select,textarea{width:100%;padding:9px;border:1px solid #b7c9cd;border-radius:7px;background:#fff;color:var(--ink)}textarea{min-height:85px}label{display:block;margin:13px 0 5px;font-weight:600}h1,h2,h3,p{margin:0 0 12px}h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}.muted,small{color:var(--muted)}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{position:sticky;top:0;height:100vh;align-self:start;overflow:auto;padding:30px 22px;background:#123b42;color:#f0f7f7}aside p{color:#b8d1d3;font-size:13px}nav button{display:block;width:100%;text-align:left;background:transparent;margin:7px 0;color:#d8e8e9}nav button.active{background:#27565d;color:#fff}main{padding:30px 40px;max-width:1320px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{background:white;border:1px solid var(--line);padding:22px;border-radius:12px;margin-bottom:16px}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:#e5efef;font-size:12px;color:#22555b}.badge.warn{background:#fff1d7;color:#805305}.badge.bad{background:#fae7e4;color:#943c2d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.notice{padding:12px 17px;border-radius:8px;margin-bottom:18px;background:#e5efef}.notice.error{background:#fae7e4;color:#943c2d}.hidden{display:none!important}.choices label{font-weight:400;display:flex;align-items:center;gap:8px;margin:8px 0}.choices input{width:auto}.evidence{border-left:3px solid #75b1ab;padding:10px 13px;background:#f3f8f7;margin-top:12px}.kv{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:6px 0}.login{max-width:440px;margin:13vh auto;padding:32px}.empty{padding:25px;color:var(--muted);background:#f8faf9;border:1px dashed #c7d6d7;border-radius:9px}.split{display:flex;gap:10px}.split>*{flex:1}a{color:var(--brand)}pre{white-space:pre-wrap;font-size:12px}@media(max-width:760px){.shell{display:block}aside{position:static;height:auto;overflow:visible;padding:18px}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap}main{padding:20px}.grid{grid-template-columns:1fr}}
</style>
<div id="login" class="card login"><span class="badge">通用三智能体平台</span><h1 style="margin-top:16px">登录工作区</h1><p class="muted">业务决策、主动感知与可信数据，在同一个工作台协作。</p><form id="loginForm"><label for="username">用户名</label><input id="username" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>登录</button></div></form><p id="loginError" role="alert" style="margin-top:12px"></p><small>首次使用：管理员在服务器运行 ga bootstrap 创建账户。</small></div>
<div id="app" class="shell hidden"><aside><h2>三智能体</h2><p>可迁移的智能协作平台</p><nav><button data-page="tasks" class="active">业务 · 任务</button><button data-page="perception">感知 · 观测</button><button data-page="data">数据 · 证据</button><button data-page="quality">治理 · 质量</button><button data-page="relations">关系 · 核查</button><button data-page="resources">对象 · 资源</button><button data-page="registry">能力 · 注册</button><button data-page="learning">进化 · 评测</button></nav><p id="identity" style="margin-top:40px"></p><button class="secondary" id="logout">退出登录</button></aside><main><div class="top"><div><small id="workspaceName"></small><h1 id="pageTitle">业务任务</h1></div><button id="refresh" class="secondary">刷新</button></div><div id="notice" class="notice hidden" role="status"></div><div id="content"></div></main></div>
<script src="/assets/device-identity.js?v=identity"></script><script src="/assets/sensing.js?v=selection"></script><script src="/assets/operator.js?v=relations"></script><script src="/assets/evolution.js?v=relations"></script><script src="/assets/goal-data.js?v=relations"></script><script src="/assets/relations.js?v=relations"></script><script src="/assets/query-needs.js?v=needs"></script><script src="/assets/quality.js?v=quality"></script><script src="/assets/data-gaps.js?v=gaps"></script><script src="/assets/query-tools.js?v=goals"></script><script src="/assets/goal-queries.js?v=goals"></script>
<script>
let csrf=sessionStorage.getItem('ga_csrf')||'', current='tasks', gapsOverview={items:[],truncated:false}, qualityOverview={policies:[]}, caps=[],entities=[],overview={},queries=[],me={},relationsOverview={items:[],truncated:false},learningOverview={candidates:[],sets:[],runs:[],deployments:[],trials:[]};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabels={waiting_data:"等待数据智能体",awaiting_collection:"等待归集回执",needs_review:"推导待核查",needs_confirmation:"待确认查询方案",confirmed:"已确认关系",withdrawn:"已撤回",proposed:"待核查声明",planning_failed:"规划中断",blocked_evidence:"证据待核查",interpreting_goal:"目标解析中",needs_clarification:"待澄清",goal_review:"待确认目标",superseded:"已被新版替代",waiting_tool:'工具执行受阻',unknown:'结果未知',frozen:'已冻结',evaluating:'评测中',evaluated:'评测通过',shadow:'影子核查',canary:'有限发布',rolled_back:'已回滚',passed:'通过',invalidated:'依据失效',pending_review:'待审核',reviewed:'已审核',draft:'草稿',review:'待核查',validated:'验证通过',published:'已发布',received:'已接收',processed:'已提取',candidate:'待核实',trusted:'可信记忆',blocked_model:'模型处理受阻',failed:'失败',queued:'排队中',planning:'规划中',approved:'已批准',executed:'已执行',awaiting_acceptance:'待验收',waiting_evidence:'等待补证',waiting_observation:'等待观测',completed:'已验收',cancelled:'已取消',resolved:'已解决',open:'待核实',rejected:'已拒绝',active:'有效',revoked:'已撤销',unknown:'下发结果未知',awaiting_observation:'等待设备观测',blocked_connector:'设备接口未就绪',blocked_resource:'设备资源被占用',running:'处理中',succeeded:'完成',sufficient:'字段证据齐全',insufficient:'证据不足',conflict:'存在冲突',pending_delivery:'待送达',complete:'完成',incomplete:'部分未完成'};
const badge=s=>`<span class="badge ${['failed','blocked_model'].includes(s)?'bad':['insufficient','conflict','review'].includes(s)?'warn':''}">${esc(statusLabels[s]||s)}</span>`;
const empty=t=>`<div class="empty">${esc(t)}</div>`;
const date=v=>v?new Date(v).toLocaleString():'尚未记录';
async function api(path,method='GET',data,requestGeneration){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:ordinaryNumericStringify(data)});let value=ordinaryNumericParse(await r.text());if(!r.ok){if(r.status===401&&(requestGeneration===undefined||requestGeneration===loadGeneration))signoutView();throw Error(typeof value.detail==='string'?value.detail:JSON.stringify(value.detail))}return value}
function notice(text,error=false){$('#notice').className='notice'+(error?' error':'');$('#notice').textContent=text}
async function action(button,fn){button.disabled=true;try{await fn()}catch(e){notice(e.message,true)}finally{button.disabled=false}}
let loadGeneration=0;
function signoutView(){loadGeneration++;me=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');sessionStorage.removeItem('ga_csrf');csrf=''}
$('#loginForm').onsubmit=async e=>{e.preventDefault();await action(e.submitter,async()=>{try{let v=await api('/login','POST',{username:$('#username').value,password:$('#password').value});csrf=v.csrf_token;sessionStorage.setItem('ga_csrf',csrf);$('#password').value='';await load()}catch(err){$('#loginError').textContent=err.message;throw err}})};
$('#logout').onclick=e=>action(e.target,async()=>{await api('/logout','POST',{});signoutView()});
$('#refresh').onclick=e=>action(e.target,load);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});
async function load(){const generation=++loadGeneration,read=path=>api(path,'GET',undefined,generation),user=await read('/me');if(generation!==loadGeneration)return false;if(me?.user_id&&me?.workspace_id&&(me.user_id!==user.user_id||me.workspace_id!==user.workspace_id||me.role!==user.role)){signoutView();throw Error('实际登录账号、工作区或权限已变化；原稿已保留，请重新登录后读取。');}const values=await Promise.all([read('/capabilities'),read('/entities'),read('/overview'),read('/data/queries'),read('/learning/overview'),read('/relations'),read('/quality'),read('/data/gaps'),read('/sensing?offset='+sensingOffset),read('/sensing/devices?offset='+deviceOffset)]);if(generation!==loadGeneration)return false;const currentUser=await read('/me');if(generation!==loadGeneration)return false;if(currentUser.user_id!==user.user_id||currentUser.workspace_id!==user.workspace_id||currentUser.role!==user.role){signoutView();throw Error('账号、工作区或权限已变化；原页面未采用迟到数据，请重新登录后读取。');}me=currentUser;[caps,entities,overview,queries,learningOverview,relationsOverview,qualityOverview,gapsOverview,sensingOverview,deviceOverview]=values;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#identity').textContent=me.username+' · '+({admin:'管理员',operator:'操作者',viewer:'只读用户'}[me.role]||me.role);$('#workspaceName').textContent=me.workspaces.find(x=>x.id===me.workspace_id)?.name||'当前工作区';render();return true}
function selectedEntities(){return [...document.querySelectorAll('input[name=entity]:checked')].map(x=>x.value)}
function entityChoices(){return entities.length?`<div class="choices">${entities.map(x=>`<label><input type="checkbox" name="entity" value="${esc(x.id)}">${esc(x.data.name||x.data.serial||x.external_id)} <small>${esc(x.entity_type)}</small></label>`).join('')}</div>`:empty('先在对象资源中添加一个真实对象。')}
function selectOptions(items,label){return '<option value="">请选择</option>'+items.map(x=>`<option value="${esc(x.id)}">${esc(label(x))}</option>`).join('')}
function observationConstraint(id){return `<label for="${id}">观测范围约束</label><select id="${id}"><option value="auto">按目标决定是否需要新观测</option><option value="existing_only">只用既有证据，禁止请求新观测</option><option value="allow_new">允许提出新观测（仍须设备授权）</option></select>`}
function modelSelect(){return `<label for="model">云模型</label><select id="model">${selectOptions(caps.filter(c=>c.kind==='foundation_model'&&c.status==='published'&&c.data.execution.task!=='embedding'),c=>c.data.description)}</select><small>凭证未配置时会保存阻塞状态，不会生成模拟结果。</small>`}
function fieldsInput(){return '<label for="fields">需要核实的字段（用逗号分隔，可留空）</label><input id="fields" placeholder="temperature, status">'}
function fieldList(){return ($('#fields')?.value||'').split(',').map(s=>s.trim()).filter(Boolean)}
function evidenceCard(run){if(dataQueryReferenceLike(run))return dataQueryReferenceCard(run);let result=run.data.result;return `<div class="card" data-query="${run.id}"><h3>${esc(run.question)}</h3>${run.data.resolved_query_id?(result?badge(run.status)+' <span class="badge">已另建查询，原结果保留</span>':'<span class="badge">方案已确认，结果见新查询</span>'):badge(run.status)} <small>${date(run.created_at)}</small>${run.data.error?`<p style="margin-top:12px">${esc(run.data.error)}</p>`:''}${result?`<p class="muted">${result.reasoning_mode==='structured'?'显式结构化查询':'云模型解析需求'} · ${result.evidence.length+(result.observation_evidence||[]).length}条证据</p>${result.evidence.map(x=>`<div class="evidence"><b>${esc(entities.find(e=>e.id===x.entity_id)?.data.name||entities.find(e=>e.id===x.entity_id)?.data.serial||entities.find(e=>e.id===x.entity_id)?.external_id||'对象')}</b> · 版本${x.version}${Object.entries(x.attributes).map(([k,v])=>`<div class="kv"><span>${esc(fieldLabel(entities.find(e=>e.id===x.entity_id),k))}</span><b>${esc(ordinaryNumericDisplay(x.attributes,k))}</b></div>`).join('')}<small>来源：资源档案 · 观测：${date(x.observed_at)}${x.observed_at ? "" : "（不能据此判断实时状态）"}</small></div>`).join('')}${observationEvidence(result.observation_evidence || [])}${reusableCases(result.trusted_cases || [])}${result.gaps.filter(g=>!result.relations||(g.missing_fields||[]).length).map(g=>`<p style="margin-top:12px">证据缺口：${esc((g.missing_fields||[]).map(f=>fieldLabel(entities.find(e=>e.id===g.entity_id),f)).join('、')||g.reason||'有效期已过')}。${esc(g.reason||'交给感知智能体核实。')}</p>`).join('')}${result.conflicts.map(g=>`<p>${esc(g.reason||("字段 "+g.field+" 同一时间的多源观测存在不同值，需核实来源和时间。"))}</p>`).join('')}`:''}</div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));$('#pageTitle').textContent=({quality:'主动质量检查与核查',tasks:'业务任务',perception:'观测与异常',data:'可信数据与证据',resources:'管理对象',relations:'对象关系与证据核查',registry:'注册与发布',learning:'进化评测与回滚'})[current];let html='';
if(current==='learning')html=renderLearning();
if(current==='tasks'){html=`<div class="grid"><div class="card"><h2>创建业务任务</h2><p class="muted">明确目标、对象和证据要求，由业务智能体规划协作。</p><form id="taskForm"><label for="goal">任务目标</label><textarea id="goal" required placeholder="例如：核查对象异常，补充证据后提出处理建议"></textarea><label>任务对象</label>${entityChoices()}${fieldsInput()}${observationConstraint('taskObservationMode')}<button style="margin-top:15px">保存任务</button></form></div><div>${overview.tasks.length?overview.tasks.map(t=>`<div class="card" data-task="${t.id}"><h3>${esc(t.title)}</h3>${badge(t.status)}<p class="muted">${date(t.created_at)}</p>${t.data.trigger==='perception.anomaly'?'<p>感知异常已送达，等待业务核查。</p>':''}${overview.plans.filter(p=>p.id===t.data.current_plan_id).map(p=>(p.data.error||p.data.result?.plan?.summary)?`<p><small>${p.status==='review'?'待执行计划：':'计划摘要：'}</small>${esc(humanTaskText(p.data.error||p.data.result?.plan?.summary||'',t))}</p>`:'').join('')}<button class="secondary" data-plan="${t.id}" data-version="${t.version}">生成／重新规划</button></div>`).join(''):empty('尚无任务；感知异常也会自动生成核查任务。')}</div></div>`}
if(current==='data'){html=`<div class="grid"><div class="card"><h2>查询并核实证据</h2><form id="queryForm"><label for="question">你需要了解什么？</label><textarea id="question" required></textarea><label>对象范围</label>${entityChoices()}${fieldsInput()}<label for="mode">查询方式</label><select id="mode"><option value="cloud">云模型解析需求</option><option value="structured">显式结构化查询</option></select>${modelSelect()}<div class="actions"><button>查询并保存</button><button type="button" class="secondary" id="diagnose">检查数据质量</button></div></form></div><div><h2>已保存的证据查询</h2>${queries.length?queries.filter(q=>dataQueryReferenceLike(q)||!q.data.gap_recheck).map(evidenceCard).join(''):empty('查询结果与阻塞原因都会保存，刷新后可继续查看。')}<h2>数据质量问题</h2>${overview.issues.map(i=>`<div class="card">${badge(i.status)} <b>${esc(i.kind==='stale'?'观测已过期':'对象数据不符合规范')}</b><p class="muted">等待核实，不自动改写事实。</p></div>`).join('')||empty('尚无已检测到的问题。')}</div></div>`}
if(current==='resources'){let packages=caps.filter(c=>c.kind==='domain_package'&&c.status==='published');html=`<div class="grid"><div class="card"><h2>添加管理对象</h2><form id="entityForm"><label for="package">业务包</label><select id="package">${selectOptions(packages,c=>c.data.description)}</select><label for="entityType">对象类型</label><select id="entityType"></select><label for="external">对象名称／外部编号</label><input id="external" required><div id="schemaFields"></div><label for="validUntil">数据有效至（可选）</label><input id="validUntil" type="datetime-local"><div class="actions"><button>保存对象</button></div></form></div><div>${entities.map(x=>`<div class="card"><h3>${esc(x.data.name||x.data.serial||x.external_id)}</h3><small>${esc(x.namespace)} · ${esc(x.entity_type)} · 版本${x.version}</small>${Object.entries(x.data).map(([k,v])=>`<div class="kv"><span>${esc(fieldLabel(entities.find(e=>e.id===x.entity_id),k))}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')}<p class="muted">有效至：${date(x.valid_until)}</p></div>`).join('')||empty('注册并发布业务包后，可以按其规范添加对象。')}</div></div>`}
if(current==='registry'){html=`<div class="grid"><div class="card"><h2>导入能力契约</h2><p class="muted">工具、专业模型、云模型、感知源和业务包采用统一注册流程。验证通过后由管理员发布。</p><form id="manifestForm"><label for="manifestFile">能力清单文件（JSON）</label><input id="manifestFile" type="file" accept=".json,application/json" required><div class="actions"><button>保存为草稿</button></div></form><p style="margin-top:18px">连接器主机由服务器白名单限制；密钥只使用环境变量引用。</p></div><div>${caps.map(c=>`<div class="card"><h3>${esc(c.description||c.data.description)}</h3>${badge(c.status)}<p class="muted">${esc(c.namespace+'.'+c.name)} · ${esc(c.release_version)} · ${esc(c.kind)}</p><p>负责人：${esc(c.data.owner)}</p><div class="actions">${c.status==='draft'?`<button class="secondary" data-validate="${c.id}" data-version="${c.version}">验证契约</button>`:''}${c.status==='validated'&&me.role==='admin'?`<button data-publish="${c.id}" data-version="${c.version}">批准发布</button>`:''}</div></div>`).join('')||empty('尚未注册能力。请先导入业务包。')}</div></div>`}
if(current==='perception'){html=`<div class="grid"><div class="card"><h2>提交设备观测</h2><p class="muted">保存数值属性或关联文件证据，提交后由后台处理并显示送达回执。设备直连须接入并验证对应接口。</p><form id="observationForm"><label for="source">感知源</label><select id="source">${selectOptions(caps.filter(c=>c.kind==='source'&&c.status==='published'),c=>c.data.description)}</select><label for="observedEntity">对象</label><select id="observedEntity">${selectOptions(entities,x=>x.data.name||x.external_id)}</select><label for="extractor">提取器</label><select id="extractor">${selectOptions(caps.filter(c=>c.status==='published'&&c.data.allowed_agent_roles.includes('perception')),c=>c.data.description)}</select><label for="record">设备观测编号</label><input id="record" required><label for="observedAt">观测时间</label><input id="observedAt" type="datetime-local" required><label for="startMode">启动方式</label><select id="startMode"><option value="manual">人工启动</option><option value="automatic">设备自动启动</option><option value="historical">历史导入</option></select><div id="observationFields"></div><div class="actions"><button>提交并保存</button></div></form></div><div><h2>观测处理</h2>${overview.observations.map(o=>`<div class="card" data-observation="${o.id}"><h3>${esc(o.source_record_id)}</h3>${badge(o.status)}<p class="muted">${date(o.observed_at)} · ${esc(o.business_day)}</p><p>提取异常：${o.data.extracted ? o.data.extracted.anomalies.length+'项' : (o.status==='failed'?'未能提取':'处理中')}</p>${o.data.extracted?.anomalies?.map(a=>`<div class="evidence">${esc(a.field)}：${esc(a.value)} · ${esc(a.severity)}</div>`).join('')||''}</div>`).join('')||empty('人工或自动启动的设备观测，都进入同一提取与归集流程。')}<h2>送达回执</h2>${overview.events.map(e=>`<div class="card">${badge(e.status)} <b>${esc({'observation.data':'观测 → 数据管理','perception.anomaly':'异常 → 业务驱动','perception.daily':'每日归集 → 数据管理','perception.acquisition_escalation':'补采升级 → 业务中枢','observation.failed':'提取失败 → 数据管理','data.gap':'数据缺口 → 感知','data.gap_coordination':'补证协调 → 业务中枢'}[e.kind]||e.kind)}</b><p class="muted">${date(e.received_at||e.created_at)}</p></div>`).join('')||empty('处理后显示数据和异常的送达回执。')}</div></div>`}
if(current==='quality')html=renderQualityPage();$('#content').innerHTML=html;bind();if(typeof augment==='function')augment()}
function schemaInputs(schema,container,prefix){let props=schema?.properties||{};$(container).innerHTML=Object.entries(props).filter(([k,v])=>['number','integer','string','boolean'].includes(v.type)).map(([k,v])=>`<label for="${prefix+esc(k)}">${esc(v.title||k)}</label>${v.type==='boolean'?`<select id="${prefix+esc(k)}" data-field="${esc(k)}" data-type="boolean"><option value="true">是</option><option value="false">否</option></select>`:`<input id="${prefix+esc(k)}" data-field="${esc(k)}" data-type="${esc(v.type)}" type="${['number','integer'].includes(v.type)?'number':'text'}" ${v.type==='number'?'step="any"':''} ${(schema.required||[]).includes(k)?'required':''}>`}`).join('')}
function attributes(container){let result={};$(container).querySelectorAll('[data-field]').forEach(x=>{if(x.value!=='')result[x.dataset.field]=x.dataset.type==='boolean'?x.value==='true':['number','integer'].includes(x.dataset.type)?Number(x.value):x.value});return result}
function bind(){
if(current==='quality')bindQuality();
if(current==='learning')bindLearning();
$('#queryForm')?.addEventListener('submit',e=>{e.preventDefault();action(e.submitter,async()=>{await api('/data/queries','POST',dataRequestFromForm());await load();notice('查询状态和证据已保存。')})});
$('#diagnose')?.addEventListener('click',e=>action(e.target,async()=>{let v=await api('/data/diagnose','POST',{});await load();notice(`已检查${v.scanned}个对象，新增${v.created_issue_ids.length}项质量问题。`)}));
$('#taskForm')?.addEventListener('submit',e=>{e.preventDefault();action(e.submitter,async()=>{let ids=selectedEntities();if(!ids.length)throw Error('请选择任务对象');let packageId=entities.find(x=>x.id===ids[0]).schema_capability_id;await api('/tasks','POST',{title:$('#goal').value,entity_ids:ids,fields:fieldList(),package_id:packageId});await load();notice('业务任务已保存。')})});
document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{let modal=document.createElement('dialog');modal.className='card';modal.innerHTML='<h2>生成业务协作计划</h2>'+modelSelect()+observationConstraint('planObservationMode')+'<div class="actions"><button id="generate">生成并保存</button><button class="secondary" id="close">取消</button></div>';modal.addEventListener('close',()=>modal.remove(),{once:true});document.body.append(modal);modal.showModal();modal.querySelector('#planObservationMode').value=overview.tasks.find(t=>t.id===b.dataset.plan).data.observation_mode||'auto';modal.querySelector('#close').onclick=()=>modal.remove();modal.querySelector('#generate').onclick=e=>action(e.target,async()=>{await api('/tasks/'+b.dataset.plan+'/plan','POST',{expected_version:Number(b.dataset.version),reason:'用户发起规划',model_profile_id:modal.querySelector('#model').value||null,observation_mode:modal.querySelector('#planObservationMode').value});modal.remove();await load();notice('规划请求已保存，后台处理后显示计划或阻塞原因。')})});
$('#manifestForm')?.addEventListener('submit',e=>{e.preventDefault();action(e.submitter,async()=>{let file=$('#manifestFile').files[0];if(file.size>200000)throw Error('契约文件过大');await api('/capabilities','POST',JSON.parse(await file.text()));await load();notice('能力草稿已保存，下一步验证契约。')})});
document.querySelectorAll('[data-validate],[data-publish]').forEach(b=>b.onclick=()=>action(b,async()=>{let id=b.dataset.validate||b.dataset.publish;await api('/capabilities/'+id+(b.dataset.validate?'/validate':'/publish'),'POST',{expected_version:Number(b.dataset.version),reason:b.dataset.validate?'操作者验证契约':'管理员批准发布'});await load();notice(b.dataset.validate?'契约已验证。':'能力已发布。')}));
if($('#package')){let update=()=>{let c=caps.find(c=>c.id===$('#package').value),schemas=c?.data.specification.entity_schemas||{};$('#entityType').innerHTML=Object.keys(schemas).map(k=>`<option>${esc(k)}</option>`).join('');schemaInputs(schemas[$('#entityType').value],'#schemaFields','attr_')};$('#package').onchange=update;$('#entityType').onchange=()=>{let c=caps.find(c=>c.id===$('#package').value);schemaInputs(c?.data.specification.entity_schemas[$('#entityType').value],'#schemaFields','attr_')};update();$('#entityForm').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{await api('/entities','POST',{package_id:$('#package').value,entity_type:$('#entityType').value,external_id:$('#external').value,attributes:attributes('#schemaFields'),valid_until:$('#validUntil').value?new Date($('#validUntil').value).toISOString():null});await load();notice('管理对象已保存。')})}}
if($('#observedEntity')){let update=()=>{let ent=entities.find(x=>x.id===$('#observedEntity').value),cap=caps.find(x=>x.id===ent?.schema_capability_id);schemaInputs(cap?.data.specification.entity_schemas[ent?.entity_type],'#observationFields','obs_')};$('#observedEntity').onchange=update;update();$('#observationForm').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{let at=new Date($('#observedAt').value);await api('/observations','POST',{source_id:$('#source').value,source_record_id:$('#record').value,entity_id:$('#observedEntity').value,observed_at:at.toISOString(),business_day:at.toISOString().slice(0,10),attributes:attributes('#observationFields'),extractor_id:$('#extractor').value,startup_mode:$('#startMode').value});await load();notice('观测已保存并进入持久队列；处理后可查看送达回执。')})}}
}
if(csrf)load().catch(()=>signoutView());
</script></html>
