services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: generic_agents
      POSTGRES_DB: generic_agents
      POSTGRES_PASSWORD: ${GA_DB_PASSWORD:?configure GA_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U generic_agents -d generic_agents"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${GA_REDIS_PASSWORD:?configure GA_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
